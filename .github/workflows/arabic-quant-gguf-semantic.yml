name: Arabic Quantization GGUF Semantic Control

on:
  push:
    branches:
      - research-arabic-quant-pilot-20260829
    paths:
      - research/arabic_quant_pilot/run_gguf_semantic_control.py
      - .github/workflows/arabic-quant-gguf-semantic.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arabic-quant-gguf-semantic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-control:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install prebuilt GGUF runtime and analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --only-binary=:all: llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -m pip install --upgrade huggingface-hub pandas numpy scipy
      - name: Run full-option likelihood control
        run: |
          python research/arabic_quant_pilot/run_gguf_semantic_control.py \
            --input-csv research/arabic_quant_pilot/smoke_results/per_question_results.csv \
            --output-dir research/arabic_quant_pilot/gguf_semantic_results \
            --repo-id prithivMLmods/Qwen3-0.6B-GGUF \
            --sample-size 100 \
            --seed 20260831 \
            --n-ctx 512 \
            --n-threads 4
      - name: Upload semantic control bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arabic-quant-gguf-semantic-results
          path: research/arabic_quant_pilot/gguf_semantic_results/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit measured semantic control results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git add research/arabic_quant_pilot/gguf_semantic_results
          if git diff --cached --quiet; then
            echo "No semantic-control result changes"
          else
            git commit -m "Add measured semantic likelihood control results [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
